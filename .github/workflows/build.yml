name: build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Checkout FDE source
        uses: actions/checkout@v4
        with:
          repository: 0xtaruhi/FDE-Source
          path: FDE-Source

      - name: Checkout IP-Generator source
        uses: actions/checkout@v4
        with:
          repository: FrancisCYH/IP-Generator
          path: IP-Generator

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libusb-1.0-0-dev \
            libboost-all-dev \
            flex \
            bison \
            clang \
            gawk \
            pkg-config \
            libffi-dev \
            libreadline-dev \
            tcl-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Install Qt 5.14.2
        run: |
          sudo apt-get install -y python3-pip
          pip3 install aqtinstall pyinstaller jinja2 Pillow
          echo 'export PATH="$HOME/.local/bin:$PATH"' >> ~/.bashrc
          source ~/.bashrc
          mkdir -p ~/Qt5.14.2 && cd ~/Qt5.14.2
          aqt install-qt linux desktop 5.14.2 gcc_64 --outputdir . --modules qtcharts qtdatavis3d qtnetworkauth qtpurchasing qtscript qtwebengine qtwebglplugin

      - name: Build Yosys from source
        run: |
          sudo apt-get install -y build-essential libreadline-dev gawk tcl-dev libffi-dev graphviz xdot pkg-config libboost-system-dev libboost-python-dev libboost-filesystem-dev
          git clone --branch yosys-0.9 https://github.com/YosysHQ/yosys.git yosys
          cd yosys
          git submodule update --init
          sed -i '1i #include <limits>' passes/sat/freduce.cc
          make config-gcc
          make -j$(nproc)
          sudo make install

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Prepare Linux sidecars
        shell: bash
        env:
          FDE_SOURCE_DIR: ${{ github.workspace }}/FDE-Source
          IP_GENERATOR_DIR: ${{ github.workspace }}/IP-Generator
          UFDE_BUILD_FDE_VIEWER: '1'
        run: ./scripts/prepare-tauri-sidecars.sh --target x86_64-unknown-linux-gnu --platform linux

      - name: Clippy app
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Clippy sidecar tools
        run: cargo clippy --manifest-path src-tauri/ip-tools/Cargo.toml --all-targets -- -D warnings
